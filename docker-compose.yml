services:

  # ─────────────────────────────────────────────────────────────
  # Node.js Application Server
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: app_primefresh
    ports:
      - "4000:4000"           # Expose app port (also proxied by NGINX on 8004)
    env_file:
      - .env                  # Loads all secrets / config at runtime
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      # Override DB/Redis hosts to use Docker service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:redis123@redis:6379
    volumes:
      - app_logs:/app/logs            # Persist Winston log files
      - app_exports:/app/exports      # Persist generated Excel/PDF exports
      - app_uploads:/app/uploads      # Persist uploaded files
      - app_multiuploads:/app/multiuploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - primefresh_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy + Static File Server
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_primefresh
    ports:
      - "8004:8004"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # SSL certificates (optional)
      - app_exports:/var/www/exports:ro         # Serve generated files directly
      - app_uploads:/var/www/uploads:ro         # Serve uploaded files directly
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - primefresh_network

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 17 Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres_primefresh
    ports:
      - "6500:5432"           # Exposed to host for pgAdmin / migrations
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro  # Init SQL scripts
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: node_typeorm
      TZ: Asia/Kolkata
    restart: unless-stopped
    networks:
      - primefresh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d node_typeorm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Redis 7 — Cache + Token Blacklist Store
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_primefresh
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - primefresh_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # pgAdmin 4 — PostgreSQL Web UI (dev/admin use only)
  # ─────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_primefresh
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password123
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "9000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - primefresh_network

# ─────────────────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redis_data:
  pgadmin_data:
  nginx_logs:
  app_logs:
  app_exports:
  app_uploads:
  app_multiuploads:

# ─────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────
networks:
  primefresh_network:
    driver: bridge

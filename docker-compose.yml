services:
  # NGINX Reverse Proxy and File Server
  nginx:
    image: nginx:alpine
    container_name: nginx_primefresh
    ports:
      - "8004:8004"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./exports:/var/www/exports:ro  # Mount exports directory for file serving
      - ./uploads:/var/www/uploads:ro  # Mount uploads directory for file serving
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL certificates (if using HTTPS)
      - nginx_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - primefresh_network

  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: postgres_primefresh
    ports:
      - '6500:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: node_typeorm
      TZ: Asia/Kolkata
    restart: unless-stopped
    networks:
      - primefresh_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis_primefresh
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - primefresh_network

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_primefresh
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password123
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
    ports:
      - '9000:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - primefresh_network

networks:
  primefresh_network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  pgadmin_data:
  nginx_logs: